<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stall Wise | Zero-Commission Marketplace — Open Your Own Shop</title>
  <meta name="description"
    content="Stall Wise is a zero-commission marketplace. Open your own shop at stallwise.in/your-name, list products with custom variants, and receive instant payments directly into your Razorpay account. 0% cut, free to start." />
  <meta name="keywords"
    content="zero commission marketplace, open online store, sell online India, creator store, direct  payments, ecommerce storefront, Stall Wise, boutique marketplace" />
  <meta name="author" content="Stall Wise" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://stallwise.in/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stall Wise" />
  <meta property="og:title" content="Stall Wise | Zero-Commission Marketplace — Open Your Own Shop" />
  <meta property="og:description"
    content="Open your online shop at stallwise.in/your-name in minutes. 0% commission on sales. Buyers pay straight into your bank account." />
  <meta property="og:url" content="https://stallwise.in/" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@stallwise" />
  <meta name="twitter:title" content="Stall Wise | Zero-Commission Marketplace — Open Your Own Shop" />
  <meta name="twitter:description"
    content="Open your online shop at stallwise.in/your-name in minutes. 0% commission. Direct payouts." />

  <!-- Mobile & PWA optimization -->
  <meta name="theme-color" content="#FF4F00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Stall Wise" />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900,700&f[]=satoshi@400,500,700&display=swap"
    rel="stylesheet" />

  <!-- Structured Data (JSON-LD) for Search Engines -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://stallwise.in/#organization",
            "name": "Stall Wise",
            "url": "https://stallwise.in/",
            "logo": "https://stallwise.in/favicon.ico",
            "description": "Zero-commission multi-vendor marketplace platform for independent creators and merchants.",
            "sameAs": []
          }
          {
            "@type": "WebSite",
            "@id": "https://stallwise.in/#website",
            "url": "https://stallwise.in/",
            "name": "Stall Wise",
            "description": "Zero-Commission Marketplace — Open Your Own Shop",
            "publisher": {
              "@id": "https://stallwise.in/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://stallwise.in/{search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>

<body class="antialiased overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
